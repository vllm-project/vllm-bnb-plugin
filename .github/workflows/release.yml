name: release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Validate release tag references package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          release_tag = os.environ["RELEASE_TAG"]
          version_tokens = {
              token
              for token in re.split(r"[-+_/]", release_tag)
              if token
          }

          if version not in version_tokens and f"v{version}" not in version_tokens:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not reference pyproject "
                  f"version {version!r}."
              )

          print(f"Building distributions for version {version}")
          PY

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vllm-bnb-plugin
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.13.0

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vllm-bnb-plugin
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  upload-release-assets:
    name: Upload GitHub release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Upload distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
